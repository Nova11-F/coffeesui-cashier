<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Shop</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
      <!-- Opening / Loading Screen -->
  <div id="loader">
    <div class="loader-content">
      <h1>Coffeesui</h1>
      <p>Preparing your coffee...</p>

      <div class="loader-bar">
        <span></span>
      </div>
    </div>
  </div>

    <!-- Header -->
    <header>
      <div class="logo">
        <i data-lucide="coffee" stroke-width="3px" width="32px" height="32px" class="icon-coffee"></i>
        <h1>Coffeesui</h1>
      </div>
      <div class="search-box" id="search-box">
        <i data-lucide="search" class="icon-search"></i>
        <input type="text" placeholder="Search products..." id="search-input" />
      </div>
      <div class="profile">
        <p>Kasir 01<br /><span>online</span></p>
        <i data-lucide="user-round" class="icon-user"></i>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container">

      <!-- categories -->
      <div class="categories" id="categories">
      </div>

      <!-- Cart -->
      <aside class="cart" id="cart">
      </aside>

      <section class="products" id="products">
      </section>


    </main>

    <!-- Lucide Icon -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>

    <!-- Javascript -->
    <script src="script.js"></script>
  </body>
</html>
